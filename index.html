<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>PAÜ Makine Mühendisliği - Analiz Sistemi</title>
    <script src="xlsx.full.min.js"></script>
    <style>
        :root {
            --pau-blue: #003366; /* Pamukkale Üni. Laciverti */
            --success-green: #2ecc71;
            --bg-color: #f4f7f6;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 700px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #eee;
            margin-bottom: 30px;
            padding-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            color: var(--pau-blue);
            font-size: 24px;
        }

        .header p {
            margin: 5px 0 0;
            color: #7f8c8d;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 15px;
            color: #34495e;
        }

        /* Dosya Yükleme Alanını Şıklaştırma */
        input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #f8f9fa;
            border: 2px dashed #ccd1d1;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        input[type="file"]:hover {
            border-color: var(--pau-blue);
            background: #ebf2fa;
        }

        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .col { flex: 1; }

        input[type="number"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border 0.3s;
        }

        input[type="number"]:focus, textarea:focus {
            outline: none;
            border-color: var(--pau-blue);
            box-shadow: 0 0 5px rgba(0,51,102,0.2);
        }

        textarea {
            height: 120px;
            resize: vertical;
            font-family: 'Courier New', Courier, monospace;
        }

        .btn-analyze {
            width: 100%;
            padding: 15px;
            background-color: var(--pau-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-analyze:hover {
            background-color: #002244;
            transform: translateY(-2px);
        }

        .btn-analyze:active {
            transform: translateY(0);
        }

        #statusMsg {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: 500;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #bdc3c7;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="pau_logo.jpg" alt="PAÜ 50. Yıl Logosu" style="width: 180px; height: auto; margin-bottom: 15px;">
        
        <h2>PAÜ Makine Mühendisliği</h2>
        <p>Öğrenim Kazanımı (ÖK) Analiz Sistemi</p>
        <p style="color: #34495e; font-weight: bold; margin-top: 10px;">(Arş. Gör. Alperen SOYER)</p>
    </div>

    <div class="input-group">
        <label>1. Excel Veri Dosyası</label>
        <input type="file" id="uploadFile" accept=".xlsx, .xls">
    </div>

    <div class="row">
        <div class="col">
            <label>2. Cevap Anahtarı Satırı</label>
            <input type="number" id="keyRow" value="2">
        </div>
        <div class="col">
            <label>3. Öğrenci Veri Başlangıcı</label>
            <input type="number" id="studentRow" value="3">
        </div>
    </div>

    <div class="input-group">
        <label>4. Analiz Kuralları (ÖK Adı, Başlangıç, Bitiş)</label>
        <textarea id="rules">ÖK1, B, Q
ÖK2, R, AG
ÖK3, AH, AO</textarea>
    </div>

    <button type="button" class="btn-analyze" onclick="runAnalysis()">
        <span>📊</span> Analizi Başlat ve Excel İndir
    </button>
    
    <div id="statusMsg"></div>

    <div class="footer-note">
        Arş. Gör. Alperen SOYER | Pamukkale Üniversitesi Makine Mühendisliği Bölümü 50. Yıl Özel
    </div>
</div>

<script>
    // Analiz fonksiyonun aynı kalıyor, dokunmana gerek yok.
    function runAnalysis() {
        var fileInput = document.getElementById('uploadFile');
        var statusDiv = document.getElementById('statusMsg');

        if (!fileInput.files.length) {
            statusDiv.innerHTML = "❌ Lütfen bir dosya seçin!";
            statusDiv.style.color = "red";
            return;
        }

        var file = fileInput.files[0];
        var reader = new FileReader();

        statusDiv.innerHTML = "⏳ Analiz yapılıyor, lütfen bekleyin...";
        statusDiv.style.color = "var(--pau-blue)";

        reader.onload = function(e) {
            try {
                var data = new Uint8Array(e.target.result);
                var workbook = XLSX.read(data, {type: 'array'});
                var sheetName = workbook.SheetNames[0];
                var sheet = workbook.Sheets[sheetName];
                var jsonData = XLSX.utils.sheet_to_json(sheet, {header: 1, defval: ""});

                var keyRowIdx = parseInt(document.getElementById('keyRow').value) - 1;
                var studentStartIdx = parseInt(document.getElementById('studentRow').value) - 1;
                var rulesText = document.getElementById('rules').value.split('\n');

                function c2n(col) {
                    var c = col.trim().toUpperCase();
                    var num = 0;
                    for (var i = 0; i < c.length; i++) {
                        num = num * 26 + (c.charCodeAt(i) - 64);
                    }
                    return num - 1;
                }

                var rules = [];
                for(var i=0; i<rulesText.length; i++) {
                    var parts = rulesText[i].split(',');
                    if(parts.length >= 3) {
                        rules.push({ name: parts[0].trim(), start: c2n(parts[1]), end: c2n(parts[2]) });
                    }
                }

                var headerRowIdx = keyRowIdx > 0 ? keyRowIdx - 1 : 0;
                var headerRow = jsonData[headerRowIdx] || [];
                var realLastCol = 0;
                for(var i = headerRow.length - 1; i >= 0; i--) {
                    if(headerRow[i] !== undefined && headerRow[i] !== "" && headerRow[i] !== null) {
                        realLastCol = i; break;
                    }
                }
                
                var writeStartCol = realLastCol + 1;
                var currentWriteCol = writeStartCol;
                var studentTotals = new Array(jsonData.length).fill(0);

                for(var r=0; r<rules.length; r++) {
                    var rule = rules[r];
                    jsonData[headerRowIdx][currentWriteCol] = rule.name + " (D)";
                    jsonData[headerRowIdx][currentWriteCol + 1] = rule.name + " (%)";
                    var keyData = jsonData[keyRowIdx];

                    for(var s=studentStartIdx; s<jsonData.length; s++) {
                        if(!jsonData[s]) jsonData[s] = [];
                        var correct = 0; var total = 0;
                        for(var c=rule.start; c<=rule.end; c++) {
                            var kVal = keyData[c] ? String(keyData[c]).trim().toUpperCase() : "";
                            var sVal = jsonData[s][c] ? String(jsonData[s][c]).trim().toUpperCase() : "";
                            if(kVal && kVal !== "NAN") {
                                total++; if(sVal === kVal) correct++;
                            }
                        }
                        var pct = total > 0 ? (correct/total)*100 : 0;
                        jsonData[s][currentWriteCol] = correct;
                        jsonData[s][currentWriteCol + 1] = Number(pct.toFixed(2));
                        studentTotals[s] += correct;
                    }
                    currentWriteCol += 2; 
                }

                jsonData[headerRowIdx][currentWriteCol] = "TOPLAM DOĞRU";
                for(var s=studentStartIdx; s<jsonData.length; s++) {
                    if(jsonData[s]) jsonData[s][currentWriteCol] = studentTotals[s];
                }
                
                var avgRowIdx = jsonData.length;
                jsonData[avgRowIdx] = []; 
                jsonData[avgRowIdx][0] = "SINIF ORTALAMASI";
                for(var c = writeStartCol; c <= currentWriteCol; c++) {
                    var sum = 0; var count = 0;
                    for(var s=studentStartIdx; s<avgRowIdx; s++) {
                        var val = jsonData[s][c];
                        if(typeof val === 'number') { sum += val; count++; }
                    }
                    jsonData[avgRowIdx][c] = count > 0 ? Number((sum/count).toFixed(2)) : 0;
                }

                var newWs = XLSX.utils.aoa_to_sheet(jsonData);
                var newWb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(newWb, newWs, "Analiz Sonuçları");
                XLSX.writeFile(newWb, "Analiz_Sonucu.xlsx");
                
                statusDiv.innerHTML = "✅ Analiz başarıyla tamamlandı!";
                statusDiv.style.color = "green";

            } catch(err) {
                statusDiv.innerHTML = "❌ Bir hata oluştu.";
                alert("Detay: " + err.message);
            }
        };
        reader.readAsArrayBuffer(file);
    }
</script>

</body>
</html>
